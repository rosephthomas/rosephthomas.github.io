                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madison, WI Weather</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; color: #1a1a2e; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; margin: 20px 0 10px; font-size: 1.8em; background: linear-gradient(135deg, #0077b6, #00b4d8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.subtitle { text-align: center; color: #666; margin-bottom: 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.card h2 { font-size: 1.1em; margin-bottom: 12px; color: #0077b6; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
th { text-align: left; padding: 8px 6px; background: #f7f9fb; font-weight: 600; color: #333; }
td { padding: 6px; border-bottom: 1px solid #eee; }
tr:hover td { background: #f0f7ff; }
.trend-up { color: #2d6a4f; }
.trend-down { color: #9b2d2d; }
.trend-none { color: #666; }
.sunset-cell { color: #9b2d2d; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
<h1>🌤️ Madison, WI Weather</h1>
<p class="subtitle">Powered by Open-Meteo API</p>
<div class="cards">
<div class="card">
<h2>⚡ Current Conditions</h2>
<div id="current-data">Loading...</div>
</div>
<div class="card">
<h2>📅 7-Day Forecast</h2>
<div id="daily-data">Loading...</div>
</div>
<div class="card">
<h2>🕐 Hourly Forecast</h2>
<div id="hourly-data">Loading...</div>
</div>
</div>
</div>

<script>
const API = 'https://api.open-meteo.com/v1/forecast';
const LAT = 43.0731;
const LON = -89.4012;
const TIMEZONE = 'America/Chicago';

function fetchJSON(url) {
  return fetch(url).then(r => r.json());
}

function wmo(code) {
  const map = {
    0:'☀️ Clear sky',1:'🌤️ Mainly clear',2:'⛅ Partly cloudy',3:'☁️ Overcast',
    45:'🌫️ Fog',48:'🌫️ Rime fog',51:'🌧️ Light drizzle',53:'🌧️ Moderate drizzle',
    55:'🌧️ Dense drizzle',56:'🌧️ Light freezing drizzle',57:'🌧️ Dense freezing drizzle',
    61:'🌧️ Slight rain',63:'🌧️ Moderate rain',65:'🌧️ Heavy rain',
    66:'🌧️ Light freezing rain',67:'🌧️ Heavy freezing rain',
    71:'❄️ Slight snow',73:'❄️ Moderate snow',75:'❄️ Heavy snow',77:'❄️ Snow grains',
    80:'🌦️ Slight rain showers',81:'🌦️ Moderate rain showers',82:'🌦️ Violent rain showers',
    85:'🌨️ Slight snow showers',86:'🌨️ Heavy snow showers',
    95:'⛈️ Thunderstorm',96:'⛈️ Thunderstorm with slight hail',99:'⛈️ Thunderstorm with heavy hail'
  };
  return map[code] || 'Unknown';
}

function formatTemp(t) {
  return Math.round(t * 9/5 + 32) + '°F';
}

function formatWind(w) {
  return Math.round(w * 2.237) + ' mph';
}

function formatPrecip(p) {
  return Math.round(p / 25.4 * 10) / 10 + ' in';
}

function moonPhaseName(phase) {
  const phases = ['🌑 New Moon', '🌒 Waxing Crescent', '🌓 First Quarter', '🌔 Waxing Gibbous', '🌕 Full Moon', '🌖 Waning Gibbous', '🌗 Last Quarter', '🌘 Waning Crescent'];
  const idx = Math.round(phase / (Math.PI / 4)) % 8;
  return phases[idx];
}

// Current conditions
fetchJSON(API + '?latitude=' + LAT + '&longitude=' + LON + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,uv_index_max,cloud_cover&timezone=' + TIMEZONE)
  .then(data => {
    const c = data.current;
    document.getElementById('current-data').innerHTML = `
      <p><strong>Conditions:</strong> ${wmo(c.weather_code)}</p>
      <p><strong>Temperature:</strong> ${formatTemp(c.temperature_2m)} (feels like ${formatTemp(c.apparent_temperature)})</p>
      <p><strong>Humidity:</strong> ${c.relative_humidity_2m}%</p>
      <p><strong>Precipitation:</strong> ${formatPrecip(c.precipitation)}</p>
      <p><strong>Wind:</strong> ${formatWind(c.wind_speed_10m)} (gusts ${formatWind(c.wind_gusts_10m)})</p>
      <p><strong>UV Index:</strong> ${c.uv_index_max}</p>
      <p><strong>Cloud Cover:</strong> ${c.cloud_cover}%</p>
    `;
  })
  .catch(e => document.getElementById('current-data').textContent = 'Error: ' + e.message);

// 7-day forecast
fetchJSON(API + '?latitude=' + LAT + '&longitude=' + LON + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max,uv_index_max,sunrise,sunset,moon_phase,weather_code&timezone=' + TIMEZONE + '&forecast_days=7')
  .then(data => {
    const d = data.daily;
    let html = '<table><tr><th>Day</th><th>Conditions</th><th>High</th><th>Low</th><th>Precip</th><th>Chance</th><th>Wind Gusts</th><th>UV</th><th>Sunrise</th><th>Sunset</th><th>Moon</th></tr>';
    for (let i = 0; i < d.time.length; i++) {
      const dt = new Date(data.time[i] + 'Z');
      const date = dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const high = formatTemp(d.temperature_2m_max[i]);
      const low = formatTemp(d.temperature_2m_min[i]);
      const trend = i > 0 ? (d.temperature_2m_max[i] - d.temperature_2m_max[i-1] >= 0 ? '↑' : '↓') : '—';
      const trendClass = i > 0 ? (d.temperature_2m_max[i] - d.temperature_2m_max[i-1] >= 0 ? 'trend-up' : 'trend-down') : 'trend-none';
      html += `<tr>
        <td>${date}</td>
        <td>${wmo(d.weather_code[i])}</td>
        <td class="${trendClass}">${trend} ${high}</td>
        <td>${low}</td>
        <td>${formatPrecip(d.precipitation_sum[i])}</td>
        <td>${d.precipitation_probability_max[i]}%</td>
        <td>${formatWind(d.wind_gusts_10m_max[i])}</td>
        <td>${d.uv_index_max[i]}</td>
        <td>${new Date(d.sunrise[i] + 'Z').toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
        <td class="sunset-cell">${new Date(d.sunset[i] + 'Z').toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
        <td>${moonPhaseName(d.moon_phase[i])}</td>
      </tr>`;
    }
    html += '</table>';
    document.getElementById('daily-data').innerHTML = html;
  })
  .catch(e => document.getElementById('daily-data').textContent = 'Error: ' + e.message);

// Hourly forecast (next 24 hours)
fetchJSON(API + '?latitude=' + LAT + '&longitude=' + LON + '&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m&timezone=' + TIMEZONE + '&forecast_hours=24')
  .then(data => {
    const h = data.hourly;
    let html = '<table><tr><th>Time</th><th>Conditions</th><th>Temp</th><th>Feels</th><th>Precip</th><th>Chance</th><th>Wind</th><th>Gusts</th></tr>';
    for (let i = 0; i < h.time.length; i++) {
      const time = new Date(h.time[i] + 'Z').toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      const temp = formatTemp(h.temperature_2m[i]);
      const feels = formatTemp(h.apparent_temperature[i]);
      html += `<tr>
        <td>${time}</td>
        <td>${wmo(h.weather_code[i])}</td>
        <td>${temp}</td>
        <td>${feels}</td>
        <td>${formatPrecip(h.precipitation[i])}</td>
        <td>${h.precipitation_probability[i]}%</td>
        <td>${formatWind(h.wind_speed_10m[i])}</td>
        <td>${formatWind(h.wind_gusts_10m[i])}</td>
      </tr>`;
    }
    html += '</table>';
    document.getElementById('hourly-data').innerHTML = html;
  })
  .catch(e => document.getElementById('hourly-data').textContent = 'Error: ' + e.message);
</script>
</body>
</html>
